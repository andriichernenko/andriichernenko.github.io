const KINDS = {"1": {"key": "nature", "label": "Hikes & nature", "emoji": "\ud83e\udd7e", "color": "#16a34a"}, "2": {"key": "towns", "label": "Towns & castles", "emoji": "\ud83c\udff0", "color": "#2563eb"}, "3": {"key": "food", "label": "Restaurants & caf\u00e9s", "emoji": "\ud83c\udf7d\ufe0f", "color": "#ea580c"}, "4": {"key": "brewery", "label": "Breweries & taprooms", "emoji": "\ud83c\udf7a", "color": "#9333ea"}};
const HOMEK = {"key": "home", "label": "Home", "emoji": "\ud83c\udfe0", "color": "#e11d48"};
const HOME = { lat: 59.305701, lon: 18.0351886, label: "Home \u2014 Sj\u00f6viksv\u00e4gen 81, Stockholm" };
const GUIDE = "https://andrii.ch/artifacts/day-trips/";
const map = L.map('map', { zoomControl: false }).setView([59.45, 17.6], 8);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors' }).addTo(map);

const bySlug = Object.fromEntries(pts.map(p => [p.slug, p]));
const markerBySlug = {};
const sel = document.getElementById('sel');
for (const k of Object.keys(itin)) {
  const o = document.createElement('option'); o.value = k; o.textContent = k + ' — ' + itin[k].title.replace(/\[[^\]]*\]\([^)]*\)/g, '').replace(/\(§[^)]*\)/g, '').replace(/^I\d+.\s*/, '').trim().slice(0, 38);
  sel.appendChild(o);
}
function icon(kind) {
  const K = {}; for (const [px, kk] of Object.entries(KINDS)) K[kk.key] = kk;
  const k = kind === 'home' ? HOMEK : (K[kind] || K['food']);
  const sz = kind === 'home' ? 32 : 28;
  return L.divIcon({ className: '', html: '<div class="pin' + (kind === 'home' ? ' home' : '') + '" style="background:' + k.color + '"><span class="pin-ic">' + k.emoji + '</span></div>', iconSize: [sz, sz], iconAnchor: [sz / 2, sz - 1] });
}
function popup(p) {
  return '<strong>' + p.label + '</strong><br><a href="' + GUIDE + '#' + p.slug + '">Guide entry</a> · <a href="https://www.google.com/maps?q=' + p.lat + ',' + p.lon + '" target="_blank" rel="noopener">Google Maps</a> · <a href="geo:' + p.lat + ',' + p.lon + '">geo:</a>';
}

// one layer group per kind + home
const layers = {};
for (const [prefix, k] of Object.entries(KINDS)) {
  const g = L.layerGroup();
  for (const p of pts.filter(p => p.kind === k.key)) { const mk = L.marker([p.lat, p.lon], { icon: icon(k.key) }).addTo(g).bindPopup(popup(p), { offset: [0, -28] }); markerBySlug[p.slug] = mk; }
  layers[k.key] = g;
}
const homeLayer = L.layerGroup();
L.marker([HOME.lat, HOME.lon], { icon: icon('home') }).addTo(homeLayer)
  .bindPopup('<strong>' + HOME.label + '</strong><br>Home base · <a href="https://www.google.com/maps?q=59.305701,18.0351886" target="_blank" rel="noopener">Google Maps</a> · <a href="geo:59.305701,18.0351886">geo:</a>', { offset: [0, -32] });
layers['home'] = homeLayer;

for (const k of Object.keys(layers)) map.addLayer(layers[k]);
// kind toggle chips in the header bar (short: emoji + count, full name in tooltip)
const kb = document.getElementById('kindbar');
function chip(key, k, cnt) {
  const l = document.createElement('label');
  l.className = 'kchip'; l.title = k.label;
  l.innerHTML = '<input type="checkbox" id="kcb-' + key + '" checked> <span class="ldot" style="background:' + k.color + '"></span>' + k.emoji + ' ' + cnt;
  l.querySelector('input').onchange = e => { e.target.checked ? map.addLayer(layers[key]) : map.removeLayer(layers[key]); };
  kb.appendChild(l);
}
for (const [px, k] of Object.entries(KINDS)) chip(k.key, k, pts.filter(p => p.kind === k.key).length);
chip('home', HOMEK, 1);
function syncChips() { for (const k of Object.keys(layers)) { const cb = document.getElementById('kcb-' + k); if (cb) cb.checked = map.hasLayer(layers[k]); } }

let itinLayer = null;
function show(key) {
  if (itinLayer) { map.removeLayer(itinLayer); itinLayer = null; }
  if (key === 'all') {
    for (const k of Object.keys(layers)) if (!map.hasLayer(layers[k])) map.addLayer(layers[k]);
  } else {
    for (const k of Object.keys(layers)) if (map.hasLayer(layers[k]) && k !== 'home') map.removeLayer(layers[k]);
    itinLayer = L.layerGroup();
    const bounds = [[HOME.lat, HOME.lon]];
    for (const s of itin[key].slugs) {
      const p = bySlug[s]; if (!p) continue;
      bounds.push([p.lat, p.lon]);
      L.marker([p.lat, p.lon], { icon: icon(p.kind) }).addTo(itinLayer).bindPopup(popup(p), { offset: [0, -28] });
    }
    L.marker([HOME.lat, HOME.lon], { icon: icon('home') }).addTo(itinLayer)
      .bindPopup('<strong>' + HOME.label + '</strong><br>Home base · <a href="https://www.google.com/maps?q=59.305701,18.0351886" target="_blank" rel="noopener">Google Maps</a> · <a href="geo:59.305701,18.0351886">geo:</a>', { offset: [0, -32] });
    itinLayer.addTo(map);
    map.fitBounds(bounds, { padding: [30, 30] });
  }
  syncChips();
}
sel.onchange = () => show(sel.value);
const qp = new URLSearchParams(location.search).get('p');
const q = new URLSearchParams(location.search).get('i');
if (q && itin[q]) sel.value = q;
show(sel.value);
if (sel.value === 'all') map.fitBounds([[58.7, 16.4], [60.4, 19.1]]);
if (qp && markerBySlug[qp]) { const p = bySlug[qp]; map.setView([p.lat, p.lon], 12); markerBySlug[qp].openPopup(); }
</script>
