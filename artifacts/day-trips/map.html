function popup(p) {
  return '<strong>' + p.label + '</strong><br><a href="' + GUIDE + '#' + p.slug + '">Guide entry</a> · <a href="https://www.google.com/maps?q=' + p.lat + ',' + p.lon + '" target="_blank" rel="noopener">Google Maps</a>';

let layer = null;

}
